services:
  - type: web
    name: nawo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerContext: ./backend
    dockerCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://nawo-api.onrender.com
      - key: FRONTEND_URL
        value: https://nawo-frontend.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.eu-central-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: nawo
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MEDIA_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        value: nawo-media
      - key: AWS_ENDPOINT
        value: https://1f4ab296a9254ca986ed34510459b214.r2.cloudflarestorage.com
      - key: AWS_URL
        value: https://pub-02678bf9bfea492f991f121e00ef69bd.r2.dev

  - type: web
    name: nawo-frontend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://nawo-api.onrender.com
